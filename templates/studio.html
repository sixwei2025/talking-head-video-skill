<!doctype html>
<!-- Multi-style 16:9 / 9:16 talking-head studio template driven by window.THV.seek(frame, fps).
     Supports 6 visual themes x 6 single-line caption styles + optional circular avatar PIP. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --w: 1920px; --h: 1080px;
    --bg: #FAF7F2; --bg-alt: #F0EAE0; --card-bg: #FFFFFF; --card-border: #E6DDD0;
    --card-shadow: #E2D8CA; --fg: #18181B; --muted: #6B6661; --accent: #C8102E; --accent-soft: #FCE8EC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: var(--w); height: var(--h); overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #orb {
    position: absolute; border-radius: 9999px; background: var(--bg-alt); opacity: 0.75;
    width: 760px; height: 760px; pointer-events: none;
  }
  #pattern { position: absolute; inset: 0; pointer-events: none; }
  body[data-style="dark-tech"] #pattern {
    background-image: linear-gradient(to right, rgba(51,61,84,0.35) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(51,61,84,0.35) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  body[data-style="paper-sketch"] #pattern {
    background-image: radial-gradient(rgba(100,116,139,0.28) 2px, transparent 2px);
    background-size: 44px 44px;
  }
  body[data-style="dazibao-impact"] #pattern {
    background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0 18px, transparent 18px 120px);
  }
  #bar { position: absolute; top: 0; left: 0; height: 8px; background: var(--accent); z-index: 10; }
  #chapter {
    position: absolute; top: 7.5%; left: 8%; padding: 10px 26px; border-radius: 999px;
    background: var(--accent-soft); border: 2px solid var(--accent); color: var(--accent);
    font-size: 30px; font-weight: 700; letter-spacing: 0.04em; z-index: 4;
  }
  body[data-style="swiss-editorial"] #chapter {
    background: transparent; border: none; border-radius: 0; padding: 0;
    font-size: 28px; text-transform: uppercase; letter-spacing: 0.14em;
  }
  #avatar {
    position: absolute; top: 5.5%; right: 8%; width: 112px; height: 112px; border-radius: 9999px;
    border: 4px solid var(--accent); object-fit: cover; display: none; z-index: 6;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  #card {
    position: absolute; top: 18%; left: 8%; right: 8%; bottom: 26%;
    background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 28px;
    padding: 64px 72px; display: flex; flex-direction: column; justify-content: center;
    box-shadow: 0 18px 42px rgba(0,0,0,0.08);
  }
  body[data-style="huixin-red"] #card {
    box-shadow: 10px 14px 0 var(--card-shadow);
    border-left: 14px solid var(--accent);
  }
  body[data-style="dazibao-impact"] #card {
    border: 4px solid var(--card-border); border-left: 22px solid var(--accent); border-radius: 16px;
  }
  body[data-style="paper-sketch"] #card {
    border: 5px solid #18181B; border-radius: 18px; box-shadow: 12px 12px 0 #18181B;
  }
  body[data-style="swiss-editorial"] #card {
    background: transparent; border: none; border-top: 4px solid var(--fg);
    border-bottom: 2px solid var(--card-border); border-radius: 0; box-shadow: none;
  }
  #visual {
    font-size: 76px; font-weight: 900; line-height: 1.32; white-space: pre-wrap;
  }
  #kw-bar { margin-top: 28px; height: 10px; border-radius: 5px; background: var(--accent); width: 0; }
  #cap-wrap {
    position: absolute; bottom: 8%; left: 4%; right: 4%;
    display: flex; justify-content: center; align-items: center; z-index: 8;
  }
  #cap {
    display: inline-flex; white-space: nowrap; font-size: 54px; font-weight: 800;
    padding: 12px 32px; border-radius: 18px;
  }
  body[data-caption="pill-highlight"] #cap { background: #18181D; color: #A1A1AA; }
  body[data-caption="pill-highlight"] #cap span.on { color: #FFFFFF; }
  body[data-caption="pill-highlight"] #cap span.on.kw { color: var(--accent); }

  body[data-caption="karaoke-glow"] #cap { background: transparent; color: var(--muted); }
  body[data-caption="karaoke-glow"] #cap span.on { color: var(--fg); text-shadow: 0 0 18px rgba(255,255,255,0.28); }
  body[data-caption="karaoke-glow"] #cap span.on.kw { color: var(--accent); }

  body[data-caption="variety-bold"] #cap { background: transparent; color: var(--muted); -webkit-text-stroke: 2px #0C0C10; paint-order: stroke fill; }
  body[data-caption="variety-bold"] #cap span.on { color: #E8FF00; }
  body[data-caption="variety-bold"] #cap span.on.kw { background: var(--accent); color: #FFFFFF; padding: 0 8px; border-radius: 8px; -webkit-text-stroke: 0; }

  body[data-caption="clean-underline"] #cap { background: transparent; color: var(--muted); }
  body[data-caption="clean-underline"] #cap span.on { color: var(--fg); }
  body[data-caption="clean-underline"] #cap span.on.kw { border-bottom: 6px solid var(--accent); padding-bottom: 4px; }

  body[data-caption="marker-box"] #cap { background: transparent; color: var(--muted); }
  body[data-caption="marker-box"] #cap span.on { color: #18181B; }
  body[data-caption="marker-box"] #cap span.on.kw { background: linear-gradient(transparent 45%, #FEF08A 45%); color: #C8102E; padding: 0 4px; }

  body[data-caption="cinema-sub"] #cap { background: rgba(18,19,25,0.92); color: #8C94A5; border-radius: 12px; }
  body[data-caption="cinema-sub"] #cap span.on { color: #F8FAFC; }
  body[data-caption="cinema-sub"] #cap span.on.kw { color: var(--accent); }

  #cover {
    position: absolute; inset: 0; background: var(--bg); display: none; z-index: 20;
    padding: 16% 10%;
  }
  #cover h1 {
    font-size: 124px; line-height: 1.2; margin: 0;
    border-left: 20px solid var(--accent); padding-left: 40px;
  }
  body.portrait #chapter { top: 9.5%; }
  body.portrait #avatar { top: 8%; width: 128px; height: 128px; }
  body.portrait #card { top: 18%; bottom: 35%; padding: 56px; }
  body.portrait #visual { font-size: 84px; }
  body.portrait #cap-wrap { bottom: 25%; }
  body.portrait #cap { font-size: 58px; }
</style>
</head>
<body>
<div id="stage">
  <div id="orb"></div>
  <div id="pattern"></div>
  <div id="bar"></div>
  <div id="chapter"></div>
  <img id="avatar" alt="" />
  <div id="card">
    <div id="visual"></div>
    <div id="kw-bar"></div>
  </div>
  <div id="cap-wrap"><div id="cap"></div></div>
  <div id="cover"><h1 id="coverTitle"></h1></div>
</div>
<script>
const THEMES = {
  'huixin-red':      { bg:'#FAF7F2', bgAlt:'#F0EAE0', cardBg:'#FFFFFF', cardBorder:'#E6DDD0', cardShadow:'#E2D8CA', fg:'#18181B', muted:'#6B6661', accent:'#C8102E', accentSoft:'#FCE8EC', cap:'pill-highlight' },
  'dark-tech':       { bg:'#181C26', bgAlt:'#222838', cardBg:'#202636', cardBorder:'#333D54', cardShadow:'#12151E', fg:'#F4F7FB', muted:'#8E99B3', accent:'#38BDF8', accentSoft:'#1E3A5F', cap:'karaoke-glow' },
  'dazibao-impact':  { bg:'#18181F', bgAlt:'#262632', cardBg:'#21212B', cardBorder:'#E8FF00', cardShadow:'#101016', fg:'#E8FF00', muted:'#A1A1AA', accent:'#E5283A', accentSoft:'#3B161E', cap:'variety-bold' },
  'swiss-editorial': { bg:'#F2EFE9', bgAlt:'#E6E1D8', cardBg:'#F2EFE9', cardBorder:'#18181B', cardShadow:'#D6D0C4', fg:'#141416', muted:'#64625E', accent:'#C8102E', accentSoft:'#F8E3E6', cap:'clean-underline' },
  'paper-sketch':    { bg:'#FFFFFF', bgAlt:'#F1F5F9', cardBg:'#FFFFFF', cardBorder:'#18181B', cardShadow:'#18181B', fg:'#18181B', muted:'#64748B', accent:'#C8102E', accentSoft:'#FEF08A', cap:'marker-box' },
  'cinematic-apple': { bg:'#1B1C24', bgAlt:'#2B2838', cardBg:'#232530', cardBorder:'#383B4C', cardShadow:'#14151C', fg:'#F8FAFC', muted:'#94A3B8', accent:'#C8102E', accentSoft:'#3E1C26', cap:'cinema-sub' },
};
window.THV = {
  coverFrames: 3,
  load(d) {
    Object.assign(this, d);
    const cfg = d.config || {};
    this.W = Number(cfg.width || 1920);
    this.H = Number(cfg.height || 1080);
    const sid = THEMES[cfg.style] ? cfg.style : 'huixin-red';
    const th = THEMES[sid];
    const csid = cfg.caption_style || th.cap;
    const r = document.documentElement.style;
    r.setProperty('--w', this.W + 'px');
    r.setProperty('--h', this.H + 'px');
    r.setProperty('--bg', th.bg);
    r.setProperty('--bg-alt', th.bgAlt);
    r.setProperty('--card-bg', th.cardBg);
    r.setProperty('--card-border', th.cardBorder);
    r.setProperty('--card-shadow', th.cardShadow);
    r.setProperty('--fg', th.fg);
    r.setProperty('--muted', th.muted);
    r.setProperty('--accent', th.accent);
    r.setProperty('--accent-soft', th.accentSoft);
    document.body.dataset.style = sid;
    document.body.dataset.caption = csid;
    if (this.H > this.W) document.body.classList.add('portrait');
    if (cfg.avatarUrl) {
      const av = document.getElementById('avatar');
      av.src = cfg.avatarUrl;
      av.style.display = 'block';
    }
    this.dur = Math.max(...d.timing.map(t => t.end)) + 0.15;
    this.start = Object.fromEntries(d.timing.map(t => [t.id, t.start]));
    document.getElementById('coverTitle').textContent = (d.segments[0].cover || d.segments[0].text);
  },
  seek(f, fps) {
    const t = f / fps, cover = f < this.coverFrames;
    document.getElementById('cover').style.display = cover ? 'block' : 'none';
    if (cover) return;
    const gx = this.W * (0.5 + 0.25 * Math.cos(t * 0.55)) - 380;
    const gy = this.H * (0.45 + 0.20 * Math.sin(t * 0.80)) - 380;
    document.getElementById('orb').style.transform = `translate(${gx}px, ${gy}px)`;
    document.getElementById('bar').style.width = (this.W * t / this.dur) + 'px';
    const seg = [...this.segments].reverse().find(s => this.start[s.id] <= t) || this.segments[0];
    const k = Math.min(1, (t - this.start[seg.id]) * fps / 10);
    const ease = 1 - Math.pow(1 - k, 3);
    const card = document.getElementById('card');
    card.style.transform = `translateX(${(1 - ease) * 90}px)`;
    card.style.opacity = String(0.2 + 0.8 * ease);
    document.getElementById('visual').textContent = seg.visual || seg.text || '';
    document.getElementById('kw-bar').style.width = (seg.keywords && seg.keywords.length) ? (280 * ease) + 'px' : '0px';
    document.getElementById('chapter').textContent = seg.chapter || '';
    const cb = this.captions.find(c => c.start <= t && t < c.end);
    const cap = document.getElementById('cap');
    cap.innerHTML = '';
    if (cb) {
      for (const c of cb.chars) {
        const s = document.createElement('span');
        s.textContent = c.t;
        if (c.s != null && c.s <= t) s.className = 'on' + (c.kw ? ' kw' : '');
        cap.appendChild(s);
      }
    }
  }
};
</script>
</body>
</html>
